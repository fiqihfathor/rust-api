apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-app-deployment
  labels:
    app: rust-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rust-app
  template:
    metadata:
      labels:
        app: rust-app
    spec:
      containers:
      - name: rust-service
        image: ghcr.io/fiqihfathor/rust-api:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "64Mi"
            cpu: "250m"
          requests:
            memory: "16Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5

--- 
apiVersion: v1
kind: Service
metadata:
  name: rust-app-service
spec:
  type: NodePort
  selector:
    app: rust-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

